# Builds the installer and update packages from source on every push, so releases can come from
# this repository instead of a developer's PC. Uploading to the releases repo is still done by
# release.ps1; signing (SignPath) will be added here once the project is accepted.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Same version as the Velopack package in SteamSync.csproj.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Build and pack
        shell: pwsh
        run: ./release.ps1 -NoUpload

      - uses: actions/upload-artifact@v4
        with:
          name: GamingEnjoyer-win
          path: artifacts/releases/
          if-no-files-found: error
